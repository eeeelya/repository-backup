name: Build & Release CLI

on:
  push:
    tags:
      - '*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/cli-linux-amd64 ./cmd/get-repository
          GOOS=linux GOARCH=arm64 go build -o dist/cli-linux-arm64 ./cmd/get-repository
          GOOS=darwin GOARCH=amd64 go build -o dist/cli-darwin-amd64 ./cmd/get-repository
          GOOS=darwin GOARCH=arm64 go build -o dist/cli-darwin-arm64 ./cmd/get-repository
          GOOS=windows GOARCH=amd64 go build -o dist/cli-windows-amd64.exe ./cmd/get-repository

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
