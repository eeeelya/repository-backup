name: Tag and Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from file
        id: get_version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "noreply@github-actions.com"

      - name: Create and push tag
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"

          git tag -fa "$VERSION" -m "Release $VERSION"
          git push -f origin "$VERSION"

      - name: Update latest tag
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          
          git tag -fa "latest" -m "Latest release: $VERSION"
          git push -f origin "latest"

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/git-repository-linux-amd64 ./cmd/git-repository
          GOOS=linux GOARCH=arm64 go build -o dist/git-repository-linux-arm64 ./cmd/git-repository
          GOOS=darwin GOARCH=amd64 go build -o dist/git-repository-darwin-amd64 ./cmd/git-repository
          GOOS=darwin GOARCH=arm64 go build -o dist/git-repository-darwin-arm64 ./cmd/git-repository
          GOOS=windows GOARCH=amd64 go build -o dist/git-repository-windows-amd64.exe ./cmd/git-repository

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
